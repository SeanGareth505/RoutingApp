<div class="app-shell" [class.sidebar-collapsed]="sidebarCollapsed()">
  <aside class="desktop-nav" [class.is-collapsed]="sidebarCollapsed()">
    <div class="sidebar-top-row">
      <button
        pButton
        type="button"
        class="p-button-text p-button-rounded collapse-toggle"
        (click)="toggleSidebar()"
        [attr.aria-label]="sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
        [attr.title]="sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      >
        <i [class]="sidebarCollapsed() ? 'pi pi-angle-right' : 'pi pi-angle-left'"></i>
      </button>
    </div>

    <div class="brand">
      <p-avatar label="RP" shape="circle"></p-avatar>
      @if (!sidebarCollapsed()) {
        <div>
          <h1>Route Planner</h1>
          <p>Premium logistics cockpit</p>
        </div>
      }
    </div>

    <nav>
      @for (item of navItems(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          class="nav-link"
          [attr.title]="sidebarCollapsed() ? item.label : null"
        >
          <i [class]="item.icon"></i>
          @if (!sidebarCollapsed()) {
            {{ item.label }}
          }
        </a>
      }
    </nav>

    <section class="sidebar-profile">
      @if (!sidebarCollapsed()) {
        <div class="profile-meta">
          <strong>{{ auth.role() }}</strong>
          <span
            class="connection-badge"
            [class.connection-direct]="connectionModeLabel() === 'Direct'"
          >
            {{ connectionModeLabel() }}
          </span>
        </div>
      }
      <button
        pButton
        type="button"
        class="p-button-sm p-button-outlined profile-theme-toggle"
        (click)="toggleTheme()"
        [attr.title]="sidebarCollapsed() ? 'Toggle theme' : null"
      >
        <i [class]="themeStore.mode() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"></i>
        @if (!sidebarCollapsed()) {
          {{ themeStore.mode() === 'dark' ? 'Light' : 'Dark' }}
        }
      </button>
    </section>
  </aside>

  <section class="content-area">
    <main class="page-container">
      <button
        pButton
        type="button"
        class="p-button-text mobile-menu"
        (click)="mobileMenuVisible.set(true)"
        aria-label="Open navigation menu"
        title="Open navigation menu"
      >
        <i class="pi pi-bars"></i>
      </button>
      <router-outlet></router-outlet>
    </main>
  </section>
</div>

<p-drawer
  [visible]="mobileMenuVisible()"
  position="left"
  styleClass="app-mobile-drawer"
  (visibleChange)="mobileMenuVisible.set($event)"
>
  <div class="mobile-drawer">
    @for (item of navItems(); track item.path) {
      <button pButton type="button" class="p-button-text drawer-link" (click)="navigate(item.path)">
        <i [class]="item.icon"></i>
        {{ item.label }}
      </button>
    }
    <button pButton type="button" class="p-button-text drawer-link" (click)="toggleTheme()">
      <i [class]="themeStore.mode() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"></i>
      {{ themeStore.mode() === 'dark' ? 'Switch to Light' : 'Switch to Dark' }}
    </button>
  </div>
</p-drawer>
