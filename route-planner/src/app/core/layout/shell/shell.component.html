<div class="app-shell">
  <aside class="desktop-nav">
    <div class="brand">
      <p-avatar label="RP" shape="circle"></p-avatar>
      <div>
        <h1>Route Planner</h1>
        <p>Premium logistics cockpit</p>
      </div>
    </div>

    <nav>
      @for (item of navItems(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          class="nav-link"
        >
          <i [class]="item.icon"></i>
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>

  <section class="content-area">
    <header class="topbar">
      <button pButton type="button" class="p-button-text mobile-menu" (click)="mobileMenuVisible.set(true)">
        <i class="pi pi-bars"></i>
      </button>
      <div>
        <h2 class="page-title">Transport Route Planning</h2>
        <p>
          Role: {{ auth.role() }}
          <span class="connection-badge" [class.connection-direct]="connectionModeLabel() === 'Direct'">
            {{ connectionModeLabel() }}
          </span>
        </p>
      </div>
      <button
        pButton
        type="button"
        class="p-button-outlined theme-toggle"
        (click)="toggleTheme()"
      >
        <i [class]="themeStore.mode() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"></i>
        {{ themeStore.mode() === 'dark' ? 'Light Mode' : 'Dark Mode' }}
      </button>
    </header>
    <main class="page-container">
      <router-outlet></router-outlet>
    </main>
  </section>
</div>

<p-drawer
  [visible]="mobileMenuVisible()"
  position="left"
  (visibleChange)="mobileMenuVisible.set($event)"
>
  <div class="mobile-drawer">
    @for (item of navItems(); track item.path) {
      <button pButton type="button" class="p-button-text drawer-link" (click)="navigate(item.path)">
        <i [class]="item.icon"></i>
        {{ item.label }}
      </button>
    }
  </div>
</p-drawer>
